<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<base href="/projetos/mobilita/">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="/projetos/mobilitav2/">
<title>Página não encontrada — Mobilità Transportes</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#468232">

<link rel="shortcut icon" href="assets/brand/favicon-mobilita.png" type="image/png">
<link rel="apple-touch-icon" href="assets/brand/apple-touch-icon-mobilita.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=KoHo:wght@400;500;600;700&family=Open+Sans:wght@400;600;700&display=swap">

<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="styles.css">
<style>
.error-page {
  min-height: 70vh;
  display: grid;
  place-items: center;
  padding: 3rem 1rem;
  text-align: center;
}
.error-card {
  max-width: 540px;
}
.error-code {
  font-family: var(--mb-font-display);
  font-size: clamp(3.5rem, 10vw, 5.5rem);
  font-weight: 700;
  line-height: 1;
  color: var(--mb-band);
  margin: 0 0 0.75rem;
}
.error-title {
  font-family: var(--mb-font-display);
  font-size: clamp(1.5rem, 3.5vw, 2rem);
  color: var(--mb-ink-strong);
  margin: 0 0 0.75rem;
}
.error-desc {
  color: var(--mb-text);
  margin: 0 0 1.5rem;
}
.error-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem;
  justify-content: center;
}
.btn-outline-ink {
  border-color: var(--mb-line);
  color: var(--mb-ink);
  background: var(--mb-white);
}
.btn-outline-ink:hover {
  border-color: var(--mb-band);
  color: var(--mb-band-deep);
}
</style>
</head>
<body>
<header class="site-header">
  <div class="header-bar">
    <a class="brand-link" href="" aria-label="Mobilità Transporte Executivo — Início">
      <img class="brand-logo" src="assets/brand/logo-mobilita-cor.png" alt="Mobilità Transporte Executivo" width="200" height="53" decoding="async">
    </a>
  </div>
</header>

<main class="error-page">
  <div class="error-card">
    <p class="error-code">404</p>
    <h1 class="error-title">Página não encontrada</h1>
    <p class="error-desc">O endereço acessado não existe ou foi movido. Volte para a página inicial ou fale com nossa equipe pelo WhatsApp.</p>
    <div class="error-actions">
      <a class="btn btn-primary" href="">Voltar para o início</a>
      <a class="btn btn-outline-ink" href="https://wa.me/5519998108070?text=Ol%C3%A1%2C%20gostaria%20de%20informacoes%20sobre%20transporte%20executivo." target="_blank" rel="noopener noreferrer">WhatsApp (19) 99810-8070</a>
    </div>
  </div>
</main>
</body>
</html>
